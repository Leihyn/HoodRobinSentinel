[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.35"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com"

# Robinhood Chain runs Blockscout, so verification uses the blockscout verifier
# rather than an Etherscan API key.
[etherscan]
robinhood_testnet = { key = "", url = "https://explorer.testnet.chain.robinhood.com/api", chain = 46630 }
robinhood_mainnet = { key = "", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }

[fmt]
line_length = 120
